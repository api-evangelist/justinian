name: Justinian
description: >-
  Justinian is an applied AI company, backed by Y Combinator (Summer 2026),
  building what it calls the first AI-native government affairs firm. Founded by
  Parth Badhwar (previously Clipbook, The White House, Deloitte's policy team,
  and the Harris campaign), Justinian helps early-stage companies monitor
  regulations, lobby policymakers, and win government contracts. The firm
  operates from San Francisco and Washington, DC, pairing staff drawn from the
  White House and top lobbying firms with engineering, and frames its mission as
  rebuilding public-private partnerships in America. Justinian currently
  presents as a services and product company with a demo-request/contact flow;
  it does not publish a public developer API, documentation, SDK, or developer
  portal at this time.
